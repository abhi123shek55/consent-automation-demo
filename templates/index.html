    <script>
        document.addEventListener('DOMContentLoaded', function () {
            
            const knownCountries = new Set();
            document.querySelectorAll('#country-list option').forEach(opt => {
                knownCountries.add(opt.value.toLowerCase());
            });

            const getAllCountryInputs = () => {
                const inputs = [];
                for (let i = 1; i <= 5; i++) {
                    inputs.push(document.getElementById('country' + i));
                }
                return inputs;
            };

            function checkDuplicates() {
                const inputs = getAllCountryInputs();
                inputs.forEach(input => input.setCustomValidity(''));

                for (let i = 0; i < inputs.length; i++) {
                    const val1 = inputs[i].value.trim();
                    if (val1 === "") continue;

                    for (let j = i + 1; j < inputs.length; j++) {
                        const val2 = inputs[j].value.trim();
                        if (val2 === "") continue;

                        if (val1.toLowerCase() === val2.toLowerCase()) {
                            inputs[j].setCustomValidity("This country is already selected in another row.");
                        }
                    }
                }
            }

            for (let i = 1; i <= 5; i++) {
                const countryInput = document.getElementById('country' + i);
                const codeInput = document.getElementById('country_code' + i);
                const pocSelect = document.getElementById('poc' + i);

                function validateRow() {
                    const val = countryInput.value.trim();
                    const hasData = val !== '' || pocSelect.value !== '';

                    if (val !== "" && !knownCountries.has(val.toLowerCase())) {
                        codeInput.classList.remove('hidden');
                        codeInput.required = true;
                    } else {
                        codeInput.classList.add('hidden');
                        codeInput.required = false;
                        codeInput.value = ""; 
                    }

                    if (i === 1) {
                        countryInput.required = true;
                        pocSelect.required = true;
                    } else {
                        countryInput.required = hasData;
                        pocSelect.required = hasData;
                    }
                    checkDuplicates();
                }

                countryInput.addEventListener('input', validateRow);
                countryInput.addEventListener('change', validateRow);
                pocSelect.addEventListener('change', validateRow);
                validateRow();
            }

            const form = document.getElementById('consent-form');
            form.addEventListener('submit', function(event) {
                let hasError = false;
                for (let i = 1; i <= 5; i++) {
                    const countryInput = document.getElementById('country' + i);
                    const codeInput = document.getElementById('country_code' + i);
                    const val = countryInput.value.trim();
                    
                    if (val !== "" && !knownCountries.has(val.toLowerCase())) {
                        if (codeInput.classList.contains('hidden')) {
                            codeInput.classList.remove('hidden');
                            codeInput.required = true;
                            hasError = true;
                        } else if (codeInput.value.trim() === "") {
                            hasError = true;
                        }
                    }
                }
                if (hasError) {
                    event.preventDefault();
                    alert("New country detected. Please provide the 2-letter Country Code in the highlighted box(es).");
                }
            });

            let currentCountryIndex = 2;
            const addCountryBtn = document.getElementById('add-country-btn');

            addCountryBtn.addEventListener('click', function() {
                const countryGroup = document.getElementById('row' + currentCountryIndex);

                if (countryGroup) {
                    countryGroup.classList.remove('hidden');
                    currentCountryIndex++;
                    if (currentCountryIndex > 5) {
                        addCountryBtn.style.display = 'none';
                    }
                }
            });
        });
    </script>
